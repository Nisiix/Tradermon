  <script>
    const STOPS = [[10, 47], [19, 49.5], [28, 52], [45, 65], [62, 51], [80, 45], [79, 24], [13, 12]];
    const tl = gsap.timeline({ paused: true });
    // inizio: mappa intera con il titolo, che lascia la scena
    tl.fromTo('#map-title', { opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(8px)', duration: 0.2, ease: 'power2.in' }, 0.6);
    tl.fromTo('#map-fly-label', { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
    // la mappa si stringe nell'angolo e scopre il gioco
    tl.fromTo('#map-ground', { opacity: 1 }, { opacity: 0, duration: 0.6, ease: 'power2.inOut' }, 0.9);
    tl.fromTo('#map-wrap', { x: 0, y: 0, scale: 1 }, { x: 644, y: -244, scale: 0.3618, duration: 0.6, ease: 'power2.inOut' }, 0.9);
    // a ogni tappa il segnaposto avanza e la scia dorata si allunga
    const CUTS = [3.0, 5.0, 7.0, 9.0, 11.0, 13.0, 15.0];
    const LEN = [0];
    for (let i = 1; i < STOPS.length; i++) LEN.push(LEN[i - 1] + Math.hypot(STOPS[i][0] - STOPS[i - 1][0], STOPS[i][1] - STOPS[i - 1][1]));
    const TOT = LEN[LEN.length - 1];
    const OFF = (l) => (l === 0 ? 110 : 100 - 100 * l / TOT);
    CUTS.forEach((t, i) => {
      const [x0, y0] = STOPS[i], [x1, y1] = STOPS[i + 1];
      tl.fromTo('#map-marker', { attr: { transform: `translate(${x0} ${y0})` } }, { attr: { transform: `translate(${x1} ${y1})` }, duration: 0.5, ease: 'power2.inOut', immediateRender: false }, t - 0.1);
      tl.fromTo('#map-trail', { attr: { 'stroke-dashoffset': OFF(LEN[i]) } }, { attr: { 'stroke-dashoffset': OFF(LEN[i + 1]) }, duration: 0.5, ease: 'power2.inOut', immediateRender: false }, t - 0.1);
    });
    // fine: la mappa torna a tutto schermo
    tl.fromTo('#map-ground', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.inOut', immediateRender: false }, 16.6);
    tl.fromTo('#map-wrap', { x: 644, y: -244, scale: 0.3618 }, { x: 0, y: 0, scale: 1, duration: 0.6, ease: 'power2.inOut', immediateRender: false }, 16.6);
    // Trasferimento di Capitale: volo da Wall Street a Borgo Semina, così il video ricomincia uguale
    tl.fromTo('#map-flight', { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 17.4);
    tl.fromTo('#map-fly-label', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out', immediateRender: false }, 17.4);
    tl.fromTo('#map-trail', { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power2.in', immediateRender: false }, 17.5);
    // volo lungo la curva tratteggiata, a piccoli tratti (ogni tratto è un tween che si può cercare avanti e indietro)
    const q = (t) => { const u = 1 - t; return [u * u * 13 + 2 * u * t * -2 + t * t * 10, u * u * 12 + 2 * u * t * 32 + t * t * 47]; };
    const ease = gsap.parseEase('power2.inOut');
    const N = 12;
    for (let k = 0; k < N; k++) {
      const [ax, ay] = q(ease(k / N)), [bx, by] = q(ease((k + 1) / N));
      tl.fromTo('#map-marker', { attr: { transform: `translate(${ax} ${ay})` } }, { attr: { transform: `translate(${bx} ${by})` }, duration: 1.1 / N, ease: 'none', immediateRender: false }, 17.6 + k * 1.1 / N);
    }
    tl.fromTo('#map-fly-label', { opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(8px)', duration: 0.18, ease: 'power2.in', immediateRender: false }, 18.6);
    tl.fromTo('#map-flight', { opacity: 1 }, { opacity: 0, duration: 0.3, immediateRender: false }, 18.75);
    tl.fromTo('#map-trail', { attr: { 'stroke-dashoffset': 0 } }, { attr: { 'stroke-dashoffset': 110 }, duration: 0.01, immediateRender: false }, 18.8);
    tl.fromTo('#map-trail', { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, 18.82);
    tl.fromTo('#map-title', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power4.out', immediateRender: false }, 18.9);
    tl.to({}, { duration: 0.01 }, 19.99);
    window.__timelines['map'] = tl;
